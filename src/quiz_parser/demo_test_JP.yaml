quiz_meta:
  title: "JLPT‑N4 日语综合模拟卷"
  subject: "日本語能力試験N4（中国人受験用）"
  version: "jlpt_n4_demo_gst_speaker_v1"
groups:
  - g: g0
    gt: "第一部分 聴解（听会话选择正确答案）"
    t: single
    gst: >
      听力答题说明：
      你将听到一段简短日语会话，会话播放完毕后，请根据听到的内容，从A、B、C中选出最佳答案。
    a:
      pd:
        - txt: "こんにちは。先週の週末、何をしましたか。"
          sp: sophie
          gap: 0.9
        - txt: "田舎の祖父母の家へ行きました。祖父母は小さい村に住んでいます。"
          sp: clint
          gap: 1.1
        - txt: "そこで果物を取りましたか。"
          sp: sophie
          gap: 0.9
        - txt: "はい。りんごとなしを取りました。とてもおいしかったです。"
          sp: clint
          gap: 1.3
    i:
      pd: "cartoon japanese boy and girl talk on weekend village, flat textbook illustration, white background"
    questions:
      - q: q0
        type: single
        stem: "祖父母はどこに住んでいますか。"
        o:
          - k: A
            t: "大きい都市"
          - k: B
            t: "小さい村"
          - k: C
            t: "大きい農場"
        ka: "B"
        e: "会话原文：祖父母は小さい村に住んでいます，因此选B。"
      - q: q1
        type: single
        stem: "先週の週末、何の果物を取りましたか。"
        o:
          - k: A
            t: "りんごとなし"
          - k: B
            t: "バナナとオレンジ"
          - k: C
            t: "ぶどうともも"
        ka: "A"
        e: "会话结尾提到：りんごとなしを取りました，选A。"
  - g: g1
    gt: "第二部分 文法・語彙 单项选择"
    t: single
    gst: >
      答题说明：选择最合适的一个选项填入横线，完成句子。
    questions:
      - q: q2
        type: single
        stem: "母は毎週土曜日、買い物に______。"
        o:
          - k: A
            t: "行く"
          - k: B
            t: "行きます"
          - k: C
            t: "行って"
        ka: "B"
        e: "毎週土曜日表示习惯性动作；ます形用于礼貌叙述，选「行きます」。"
      - q: q3
        type: single
        stem: "ペットボトルの中に水______あります。"
        o:
          - k: A
            t: "が"
          - k: B
            t: "は"
          - k: C
            t: "を"
        ka: "A"
        e: "存在句「～があります」，事物主体使用助词が。"
      - q: q4
        type: single
        stem: "— あなたの新しいかばんは______ですか。— 青いです。"
        o:
          - k: A
            t: "何"
          - k: B
            t: "何色"
          - k: C
            t: "どんな"
        ka: "B"
        e: "答句回答颜色，疑问词使用「何色」询问色彩。"
      - q: q5
        type: single
        stem: "______名前は李明です。"
        o:
          - k: A
            t: "彼"
          - k: B
            t: "彼を"
          - k: C
            t: "彼の"
        ka: "C"
        e: "名词名前前面需要连体修饰，「彼の」表示“他的”。"
      - q: q6
        type: single
        stem: "— 新しい先生______いますか。— はい、います。"
        o:
          - k: A
            t: "が"
          - k: B
            t: "は"
          - k: C
            t: "を"
        ka: "A"
        e: "人存在疑问句，主体助词用が。"
      - q: q7
        type: single
        stem: "— 一番好きな食べ物は何ですか。— 魚が好きです。______おいしいですから。"
        o:
          - k: A
            t: "それは"
          - k: B
            t: "それらは"
          - k: C
            t: "それらが"
        ka: "A"
        e: "魚为单数事物，使用「それは」指代前面提到的事物。"
      - q: q8
        type: single
        stem: "寝室にベッドが一つ、サイドテーブルが二つ、クローゼット______あります。"
        o:
          - k: A
            t: "も"
          - k: B
            t: "が"
          - k: C
            t: "を"
        ka: "B"
        e: "日语存在句，并列列举事物，每一类事物主体后接助词が。"
      - q: q9
        type: single
        stem: "— パーティーで日本の歌を歌えます。— ______。"
        o:
          - k: A
            t: "すごいです"
          - k: B
            t: "はい、歌えます"
          - k: C
            t: "すみません"
        ka: "A"
        e: "听到对方展示才艺，日语用「すごいです」表达夸奖。"
  - g: g2
    gt: "第三部分 完形填空"
    t: cloze
    gst: >
      完形填空答题说明：阅读下面日语短文，从A、B、C选出最合适的选项补全文章。
      アンナと家族は大きな___1___に住んでいます。大きな窓がたくさんあります。外には木がたくさん___2___。
      鳥たちは家のまわりを___3___のが好きです。
      ある日、___4___意外なことが起きました。アンナと弟が絵を描いていると、すずめが窓にぶつかりました。
      二人は急いで外へ出て、小さいすずめ___5___拾いました。弟は「このすずめはけがをしています。私たちは___6___ましょう」と言いました。
      それから、私たちはそれを部屋の中___7___持って帰り、暖かく暗い箱の中に入れました。水と食べ物もあげました。
      次の日、箱___8___何か音が聞こえました。私たちは箱を___9___。すると、すずめが外へ飛んでいきました。
      「今度は___10___ね、小さいすずめ」私たちは言いました。すずめは飛んでいきましたが、私たちはとても嬉しかったです。
    i:
      pd: "cartoon japanese girl and boy help hurt sparrow, flat textbook illustration, white background"
    questions:
      - q: q10
        type: cloze
        stem: "___1___"
        o:
          - k: A
            t: "家"
          - k: B
            t: "公園"
          - k: C
            t: "動物園"
        ka: "A"
        e: "后文提到很多窗户，是居住的房子，选「家」。"
      - q: q11
        type: cloze
        stem: "___2___"
        o:
          - k: A
            t: "います"
          - k: B
            t: "あります"
          - k: C
            t: "です"
        ka: "B"
        e: "木是无生命物体，存在句用「あります」。"
      - q: q12
        type: cloze
        stem: "___3___"
        o:
          - k: A
            t: "走る"
          - k: B
            t: "飛ぶ"
          - k: C
            t: "読む"
        ka: "B"
        e: "小鸟的动作是飞翔，动词选「飛ぶ」。"
      - q: q13
        type: cloze
        stem: "___4___"
        o:
          - k: A
            t: "ある"
          - k: B
            t: "この"
          - k: C
            t: "どんな"
        ka: "A"
        e: "「ある意外なこと」：某一件意想不到的事情，N4常用连体修饰。"
      - q: q14
        type: cloze
        stem: "___5___"
        o:
          - k: A
            t: "を"
          - k: B
            t: "に"
          - k: C
            t: "で"
        ka: "A"
        e: "拾う是他动词；拾取的对象用助词を。"
      - q: q15
        type: cloze
        stem: "___6___"
        o:
          - k: A
            t: "かい"
          - k: B
            t: "たすけ"
          - k: C
            t: "みつけ"
        ka: "B"
        e: "小鸟受伤，我们帮助它；「たすけましょう」让我们帮助吧。"
      - q: q16
        type: cloze
        stem: "___7___"
        o:
          - k: A
            t: "へ"
          - k: B
            t: "に"
          - k: C
            t: "を"
        ka: "B"
        e: "「～の中に」表示移动到达的地点，拿到屋子里面。"
      - q: q17
        type: cloze
        stem: "___8___"
        o:
          - k: A
            t: "から"
          - k: B
            t: "ので"
          - k: C
            t: "まで"
        ka: "A"
        e: "箱から音が聞こえました：从箱子里面传来声音。"
      - q: q18
        type: cloze
        stem: "___9___"
        o:
          - k: A
            t: "開けました"
          - k: B
            t: "掃除しました"
          - k: C
            t: "閉めました"
        ka: "A"
        e: "后面小鸟飞出去，说明我们打开箱子，「開けました」。"
      - q: q19
        type: cloze
        stem: "___10___"
        o:
          - k: A
            t: "すばらしい"
          - k: B
            t: "気をつけて"
          - k: C
            t: "やさしい"
        ka: "B"
        e: "「気をつけて」小心点，对飞走的小鸟叮嘱。"
  - g: g3
    gt: "第四部分 阅读理解（一）"
    t: single
    gst: >
      阅读理解答题说明：阅读日语短文，根据文章内容，从A/B/C选出正确答案。
      うさぎちゃんは読書が好きです。毎日午後、大きな木の下で本を読みます。
      ある日、宇宙の物語の新しい本を見つけました。
      二時間読んで、月についておもしろいことをたくさん学びました。
    i:
      pd: "cartoon cute japanese rabbit read book under tree, flat textbook illustration, white background"
    questions:
      - q: q20
        type: single
        stem: "うさぎちゃんは毎日午後、どこで本を読みますか。"
        o:
          - k: A
            t: "家の中"
          - k: B
            t: "大きな木の下"
          - k: C
            t: "図書館"
        ka: "B"
        e: "原文：毎日午後、大きな木の下で本を読みます，选B。"
      - q: q21
        type: single
        stem: "新しい本は何についての本ですか。"
        o:
          - k: A
            t: "宇宙"
          - k: B
            t: "動物"
          - k: C
            t: "海"
        ka: "A"
        e: "文中：宇宙の物語の新しい本を見つけました，选A。"
  - g: g4
    gt: "第五部分 阅读理解（二）"
    t: single
    gst: >
      阅读理解答题说明：阅读下面短文，选择最合适答案。
      トムは12歳です。スポーツが大好きです。週末はいつも八時に起きます。
      公園で友達とよくバスケットボールをします。時々サイクリングもします。
      スポーツをすると体が丈夫になって、嬉しくなると彼は言っています。
    questions:
      - q: q22
        type: single
        stem: "トムは何歳ですか。"
        o:
          - k: A
            t: "11歳"
          - k: B
            t: "12歳"
          - k: C
            t: "13歳"
        ka: "B"
        e: "文章第一句：トムは12歳です，选B。"
      - q: q23
        type: single
        stem: "トムは週末によく何をしますか。"
        o:
          - k: A
            t: "バスケットボールをする"
          - k: B
            t: "水泳をする"
          - k: C
            t: "テレビを見る"
        ka: "A"
        e: "原文：公園で友達とよくバスケットボールをします，选A。"

  # ========= 新增：阅读判断正误 tf N4 =========
  - g: g5
    gt: "第六部分 読解 判断（T/F）"
    t: single
    gst: >
      判断答题说明：阅读日文短文，判断句子正误，正确T，错误F。
      トムは毎朝7時に起きます。自転車で学校へ行きます。週末は公園でサッカーをします。
    questions:
      - q: q24
        type: tf
        stem: "トムは毎朝七時に起きます。"
        tf_correct: true
        e: "短文原文写明トムは毎朝7時に起きます，这句话正确。"
      - q: q25
        type: tf
        stem: "トムは毎日歩いて学校へ行きます。"
        tf_correct: false
        e: "原文是骑自行车自転車で学校へ行きます，不是步行，故错误。"

  # ========= 新增：日语语法填空 fill N4 =========
  - g: g6
    gt: "第七部分 文法穴埋め（填空）"
    t: single
    gst: >
      填空答题说明：阅读句子，填入合适的日语单词/助词完成句子。
    questions:
      - q: q26
        type: fill
        stem: "私は毎日7時______起きます。"
        fill_keys: ["に"]
        e: "时间点后面使用助词に，表示动作发生的时间。"
      - q: q27
        type: fill
        stem: "昨日、友達と______（行く）ました。"
        fill_keys: ["行っ"]
        e: "行く的た形ます连用形是行っ，构成过去式行きました。"
